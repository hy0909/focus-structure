  /* 피그마 '로그인' 섹션 기준: 0층 움직이는 그라데이션, 1층 파란 덮개, 2층 명도 덮개, 그 위 가운데 카드 */
  :root {
    --gray-200: #e5e7eb;
    --gray-300: #d1d5db;
    --gray-400: #9ca3af;
    --gray-500: #6b7280;
    --gray-600: #4b5563;
    --gray-700: #374151;
    --gray-800: #1f2937;
    --gray-900: #111827;
    --primary: #276cf1;
    --critical-700: #ca3e3e;
    --layer-1: rgba(39, 108, 241, 0.5);
    --layer-2: rgba(0, 0, 0, 0.04);
    --font: "Pretendard", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    /* 글자·컴포넌트 스케일 배율. 기본(적용 전)은 1배 */
    --fz: 1px;
    color-scheme: dark;
  }
  /* 적용 후: 1280에서 1배, 1280px 늘 때마다 +0.25배, 3840에서 1.5배로 멈춤 */
  :root.scale-on { --fz: clamp(1px, calc(1px + (100vw - 1280px) / 5120), 1.5px); }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--gray-900);
    color: var(--gray-300);
    font-family: var(--font);
    overflow: hidden;
  }

  /* 배경 3층 */
  .layer { position: fixed; inset: 0; }
  .layer-0 { z-index: 0; }
  .layer-1 { z-index: 1; background: var(--layer-1); }
  .layer-2 { z-index: 2; background: var(--layer-2); mix-blend-mode: luminosity; }
  /* 주소 끝에 #no-overlay 를 붙이면 1층·2층 덮개를 끈 모습으로 본다 */
  :root.no-overlay .layer-1, :root.no-overlay .layer-2 { display: none; }

  /* 카드 자리 */
  .stage {
    position: relative; z-index: 3;
    height: 100%;
    display: flex; align-items: center; justify-content: center;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 10px;
    overflow-y: auto;
  }
  /* 카드 폭: 12단 그리드(바깥 여백 20, 칸 사이 20)에서 가운데 4칸. 1280일 때 400, 1920일 때 613.3.
     최대 512. 1280보다 좁으면 400을 유지하고, 그보다 더 좁은 화면에서는 화면 폭에 맞춘다 */
  .card {
    width: max(calc((100vw - 260px) / 3 + 60px), min(400px, 100%)); max-width: min(512px, 100%);
    background: var(--gray-900);
    border: 1px solid var(--gray-800);
    border-radius: 20px;
    display: flex; flex-direction: column;
  }

  .card-head { display: flex; justify-content: center; padding-block: 48px; }
  .logo { position: relative; width: 176px; height: 31.37px; overflow: hidden; }
  .logo img { position: absolute; display: block; max-width: none; }
  .logo .flip { transform: scaleX(-1); }

  /* 안쪽 내용 최대 너비 360 (피그마 max-w 360), 가운데 정렬 */
  .fields { display: flex; flex-direction: column; align-items: center; gap: 40px; padding-inline: 44px; }
  .field { display: flex; flex-direction: column; gap: calc(4 * var(--fz)); width: 100%; max-width: 360px; }
  .field label {
    font-size: calc(15 * var(--fz)); font-weight: 600; line-height: 1.467;
    color: var(--gray-300);
  }
  .field input {
    height: calc(40 * var(--fz)); width: 100%;
    padding: calc(8 * var(--fz)) calc(12 * var(--fz));
    background: var(--gray-900);
    border: 1px solid var(--gray-700);
    border-radius: calc(8 * var(--fz));
    font: 400 calc(15 * var(--fz))/1.36 var(--font);
    letter-spacing: 0.2175px;
    color: var(--gray-300);
    outline: none;
  }
  .field input::placeholder { color: var(--gray-600); opacity: 1; }
  .field input:focus-visible { border-color: var(--primary); }

  .card-foot { display: flex; flex-direction: column; align-items: center; gap: 48px; padding: 44px; }
  .submit-group { display: flex; flex-direction: column; gap: 24px; width: 100%; max-width: 360px; }
  .error {
    margin: 0; text-align: center;
    font-size: calc(14 * var(--fz)); font-weight: 400; line-height: 1.571; letter-spacing: 0.203px;
    color: var(--critical-700);
    visibility: hidden;
  }
  .error.is-shown {
    visibility: visible;
    font-weight: 600; line-height: 1.429; letter-spacing: -0.168px;
  }
  .login-btn {
    height: calc(40 * var(--fz)); width: 100%;
    border: 0; border-radius: calc(8 * var(--fz));
    padding: calc(8 * var(--fz)) calc(12 * var(--fz));
    font: 400 calc(15 * var(--fz))/1.36 var(--font); letter-spacing: 0.2175px;
    background: var(--primary); color: var(--gray-200);
    cursor: pointer;
  }
  .login-btn:disabled { background: var(--gray-700); color: var(--gray-500); cursor: default; }
  .login-btn:focus-visible, .text-btn:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }

  .links { display: flex; }
  .text-btn {
    height: calc(36 * var(--fz)); padding: calc(8 * var(--fz)) calc(20 * var(--fz));
    border: 0; border-radius: calc(8 * var(--fz)); background: transparent;
    font: 400 calc(15 * var(--fz))/1.36 var(--font); letter-spacing: 0.2175px;
    color: var(--gray-400);
    cursor: pointer; white-space: nowrap;
  }

  @media (max-width: 460px) {
    .fields { padding-inline: 24px; }
    .card-foot { padding: 44px 24px; }
    .text-btn { padding-inline: calc(12 * var(--fz)); }
  }

  /* 비교용 전환 버튼 (시안 확인용, 실제 화면에는 없음) */
  .compare {
    position: fixed; z-index: 10;
    top: calc(16px + env(safe-area-inset-top, 0px));

<script>
  const applyOverlay = () => document.documentElement.classList.toggle("no-overlay", location.hash === "#no-overlay");
  applyOverlay();
  window.addEventListener("hashchange", applyOverlay);

  // 스케일 규칙 적용 전/후 전환
  const offBtn = document.getElementById("scale-off");
  const onBtn = document.getElementById("scale-on");
  const readout = document.getElementById("scale-readout");
  let scaleOn = false;
  const fzOf = (w) => Math.min(1.5, Math.max(1, 1 + (w - 1280) / 5120));
  const renderScale = () => {
    document.documentElement.classList.toggle("scale-on", scaleOn);
    offBtn.setAttribute("aria-pressed", String(!scaleOn));
    onBtn.setAttribute("aria-pressed", String(scaleOn));
    const w = document.documentElement.clientWidth;
    const k = scaleOn ? fzOf(w) : 1;
    readout.textContent = `화면 ${w}px · ${Math.round(k * 1000) / 1000}배`;
  };
  offBtn.addEventListener("click", () => { scaleOn = false; renderScale(); });
  onBtn.addEventListener("click", () => { scaleOn = true; renderScale(); });
  window.addEventListener("resize", renderScale);
  renderScale();

  // 입력 전 → 입력 후 → 오류 상태 전환 (서버가 없는 시안이라 로그인을 누르면 항상 오류 상태로 보여 줌)
  const form = document.getElementById("login-form");
  const idInput = document.getElementById("user-id");
  const pwInput = document.getElementById("user-pw");
  const btn = document.getElementById("login-btn");
  const error = document.getElementById("login-error");

  const sync = () => { btn.disabled = !(idInput.value.trim() && pwInput.value); };
  idInput.addEventListener("input", sync);
  pwInput.addEventListener("input", sync);

  form.addEventListener("submit", (e) => {
    e.preventDefault();
    if (btn.disabled) return;
    idInput.value = "";
    pwInput.value = "";
    error.classList.add("is-shown");
    sync();
    idInput.focus();
  });
</script>

<script type="module">
  // 0층: shaders.paper.design static mesh gradient 설정을 천천히 움직이게 한 배경
  import {
    ShaderMount,
    staticMeshGradientFragmentShader,
    getShaderColorFromString,
    ShaderFitOptions,
  } from "https://cdn.jsdelivr.net/npm/@paper-design/shaders@0.0.82/+esm";

  const base = {
    colors: ["#003cff", "#003cff", "#38fcff", "#99ffdb"],
    positions: 23, waveX: 1, waveXShift: 0.6, waveY: 1, waveYShift: 0.21,
    mixing: 0.93, grainMixer: 0, grainOverlay: 0, scale: 1, rotation: 270, offsetX: 0, offsetY: 0,
  };
  const motion = { speed: 1, xShift: 0.08, yShift: 0.08, positions: 0.6 };

  const uniforms = (t) => ({
    u_colors: base.colors.map(getShaderColorFromString),
    u_colorsCount: base.colors.length,
    u_positions: base.positions + motion.positions * Math.sin(t * 0.07),
    u_waveX: base.waveX,
    u_waveXShift: base.waveXShift + motion.xShift * Math.sin(t * 0.25),
    u_waveY: base.waveY,
    u_waveYShift: base.waveYShift + motion.yShift * Math.sin(t * 0.19 + 1.3),
    u_mixing: base.mixing,
    u_grainMixer: base.grainMixer,
    u_grainOverlay: base.grainOverlay,
    u_fit: ShaderFitOptions.contain,
    u_rotation: base.rotation,
    u_scale: base.scale,
    u_offsetX: base.offsetX,
    u_offsetY: base.offsetY,
    u_originX: 0.5, u_originY: 0.5, u_worldWidth: 0, u_worldHeight: 0,
  });

  const mount = new ShaderMount(document.getElementById("bg"), staticMeshGradientFragmentShader, uniforms(0), undefined, 0);

  if (!window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
    let t = 0, last = performance.now();
    const tick = (now) => {
      const dt = Math.min(0.1, (now - last) / 1000);
      last = now;
      if (!document.hidden) { t += dt * motion.speed; mount.setUniforms(uniforms(t)); }
      requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  }
</script>
